[package]
name = "vixen-render"
version.workspace = true
edition.workspace = true

[dependencies]
# Metal only, to keep the build small. `std` adds no backend: it is what makes `util::StagingBelt` available.
wgpu = { version = "30", default-features = false, features = ["std", "metal", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0"
parking_lot.workspace = true
libc = "0.2"
