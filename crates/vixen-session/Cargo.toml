[package]
name = "vixen-session"
version.workspace = true
edition.workspace = true

# The preview designer's Import Prop. Optional so that work in progress on the prop crate can't stop this shared crate from building.
[features]
prop-import = ["dep:vixen-prop"]

[dependencies]
vixen-video = { path = "../vixen-video" }
vixen-core = { path = "../vixen-core" }
vixen-effects = { path = "../vixen-effects" }
vixen-effect-registry = { path = "../vixen-effect-registry" }
fx-audio-state = { path = "../fx-audio-state" }
fx-pixel-graphics = { path = "../fx-pixel-graphics" }
vixen-engine = { path = "../vixen-engine" }
vixen-io = { path = "../vixen-io" }
vixen-audio = { path = "../vixen-audio" }
vixen-analysis = { path = "../vixen-analysis" }
vixen-export = { path = "../vixen-export" }
vixen-fpp = { path = "../vixen-fpp" }
vixen-web = { path = "../vixen-web" }
vixen-output = { path = "../vixen-output" }
vixen-preview = { path = "../vixen-preview" }
vixen-prop = { path = "../vixen-prop", optional = true }
vixen-render = { path = "../vixen-render" }
vixen-xml = { path = "../vixen-xml" }
fx-fixture = { path = "../fx-fixture" }
uuid.workspace = true
parking_lot.workspace = true
rayon.workspace = true
image.workspace = true
thiserror.workspace = true
serde_json.workspace = true
libc = "0.2"
rust_decimal = { version = "=1.43.0", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
unicode-normalization = "=0.1.26"
# STUDIO-BEGIN preview-video-deps: AVFoundation H.264/AAC writer for the MCP preview_video tool
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSError", "NSArray", "NSObject"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMTimeRange", "CMSampleBuffer", "CMBase", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
# STUDIO-END preview-video-deps

[lints.rust]
# Set by scripts/build_app.sh: app-bundle builds leave out developer fallback paths.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(vixen_app_bundle)'] }
