name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't paste secrets, show files with personal data, or passwords**.
        Security problems go to Security ▸ Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: About Vixen ▸ version, or the commit you built from.
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.2, MacBook Pro M4
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. The profile's logs folder has Application.Error.log.
